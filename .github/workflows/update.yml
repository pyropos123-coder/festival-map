name: 축제 데이터 갱신
on:
  schedule: [{ cron: "0 18 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-festivals.mjs
        env: { TOUR_API_KEY: "${{ secrets.TOUR_API_KEY }}" }
      - name: 변경 시 커밋
        run: |
          git config user.name "festival-bot"; git config user.email "bot@users.noreply.github.com"
          git add festivals.json; git diff --cached --quiet || (git commit -m "축제 데이터 갱신" && git push)
